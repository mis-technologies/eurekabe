<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token"" content="{{ csrt() }}">
    <title>WebSocket Test with Laravel Reverb</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        #messages {
            width: 100%;
            height: 300px;
            border: 1px solid #ccc;
            padding: 10px;
            overflow-y: scroll;
        }

        #inputSection {
            margin-top: 10px;
        }

        #inputSection input {
            width: 300px;
            padding: 5px;
        }

        #inputSection button {
            padding: 5px 10px;
        }
    </style>
</head>

<body>
    <h1>WebSocket Test with Laravel Reverb</h1>
    <div id="messages">
        <!-- Messages will be displayed here -->
    </div>

    <div id="inputSection">
        <input type="text" id="messageInput" placeholder="Type your message here...">
        <button onclick="sendMessage()">Send Message</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/pusher-js@8.4.0-rc2/dist/web/pusher.min.js"></script>
    <script>
        // Replace with your Laravel WebSocket server configuration
        const wsHost = "127.0.0.1";  // Replace with your WebSocket server IP or hostname
        const wsPort = "8080";       // WebSocket port (set to the port your WebSocket server is using)

        // Initialize Pusher with your WebSocket configuration
        Pusher.logToConsole = true;  // For debugging purposes

        const pusher = new Pusher("fovplylsfhqiyhq79yyp", {
            wsHost: wsHost,
            wsPort: wsPort,
            wssPort: wsPort,
            cluster: "mt1",
            forceTLS: false,
            disableStats: true,
            enabledTransports: ['ws'],
            auth: {
                headers: {
                    Authorization: 'Bearer 3|OJJIbTEGwPskBAV02JVBERfUPiDocGqfQZXljbrZ988f2d6e',
                }
            },
            authorizer: (channel, options) => {
                return {
                    authorize: (socketId, callback) => {
                        console.log('Authorizing:', { socketId, channel: channel.name });

                        fetch('api/broadcasting/auth', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer 3|OJJIbTEGwPskBAV02JVBERfUPiDocGqfQZXljbrZ988f2d6e',
                                "Accept": "application/vnd.api+json"
                            },
                            body: JSON.stringify({
                                socket_id: socketId,
                                channel_name: channel.name
                            })
                        })
                            .then(response => response.json())
                            .then(data => {
                                console.log('Authorization success:', data);
                                callback(false, data);
                            })
                            .catch(error => {
                                console.log('Authorization error:', error);
                                callback(true, error);
                            });
                    }
                };
            },
        });

        // Log connection state changes
        pusher.connection.bind('state_change', function (states) {
            console.log('Connection state changed:', states);
        });

        // Log connection success and failure
        pusher.connection.bind('connected', function () {
            console.log('WebSocket connected successfully');
        });

        pusher.connection.bind('disconnected', function () {
            console.log('WebSocket disconnected');
        });

        pusher.connection.bind('failed', function (err) {
            console.error('WebSocket connection failed:', err);
        });

        pusher.connection.bind('error', function (err) {
            console.error('WebSocket error:', err);
        });

        // Subscribe to the channel and log subscription state
        const channel = pusher.subscribe('private-1');

        channel.bind('pusher:subscription_succeeded', function () {
            console.log('Successfully subscribed to the channel');
        });

        channel.bind('pusher:subscription_error', function (err) {
            console.error('Subscription error:', err);
        });

        // Log received events and messages
        channel.bind('Conversation', function (data) {
            console.log('Received conversation event:', data);
            const messageDiv = document.getElementById('messages');
            const newMessage = document.createElement('div');
            newMessage.textContent = `Message: ${data.data.recent_message.text}`;
            messageDiv.appendChild(newMessage);
        });

        // Send a message and log the response
        function sendMessage() {
            const message = document.getElementById('messageInput').value;
            console.log('Sending message:', message);

            // Send an AJAX request to Laravel backend
            fetch('/api/v1/messaging/conversations/2/messages', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-TOKEN': document.querySelector('meta[name="csrf-token"]').getAttribute('content'),
                    'Authorization': 'Bearer 1|xKnxuiATc31TTVpfIfHPQXYodjJu31JzFfz0LgoWf4c9c8f7',
                    "Accept": "application/vnd.api+json"
                },
                body: JSON.stringify({ text: message })
            }).then(response => response.json()).then(data => {
                if (data.success) {

                    const messageDiv = document.getElementById('messages');
                    const newMessage = document.createElement('div');
                    newMessage.textContent = `Message: ${message}`;
                    messageDiv.appendChild(newMessage);

                    console.log('Message sent successfully:', data);
                } else {
                    console.log('Failed to send message:', data);
                }
            }).catch(error => {
                console.error('Error sending message:', error);
            });
        }

        // Log everything, including custom events
        pusher.connection.bind('all', function (eventName, data) {
            // console.log(`Event: ${eventName}`, data);
        });

    </script>
</body>

</html>

[variables]
COMPOSER_ALLOW_SUPERUSER="1"
UPLOAD_MAX_FILESIZE = '100M'
POST_MAX_SIZE = '100M'

[phases.build]
cmds = [
  "composer install --no-dev", 
  "npm install",
  "PHP_INI_PATH=$(php -i | grep '/php.ini' | awk '{print $6}') && echo 'post_max_size = 100M' | tee -a $PHP_INI_PATH",
  "PHP_INI_PATH=$(php -i | grep '/php.ini' | awk '{print $6}') && echo 'upload_max_filesize = 100M' | tee -a $PHP_INI_PATH",
  "PHP_INI_PATH=$(php -i | grep '/php.ini' | awk '{print $6}') && echo 'memory_limit = 100M' | tee -a $PHP_INI_PATH",
  'UPLOAD_INI_PATH=$(find /nix/store/*-php-*/lib -name php.ini -print0 | tail -z -n 1 | rev | cut -c 9- | rev)/upload.ini; echo "upload_max_filesize=${UPLOAD_MAX_FILESIZE};" >> $UPLOAD_INI_PATH; echo "post_max_size=${POST_MAX_SIZE};" >> $UPLOAD_INI_PATH'

]



[phases.setup]
cmds = [
  "composer install --no-dev",
]



[phases.start]
cmds = [
  "php artisan storage:link",
  "chmod -R 777 storage bootstrap/cache",
  "chmod -R 777 storage public/uploads",
  "chmod -R 777 /app/public/uploads/",
  "php artisan optimize:clear"
]

[volumes]
storage = "/app/storage"
server {
    listen 80;
    index index.php index.html;
    server_name localhost;

    client_max_body_size 100M;  # Increase max upload size for Laravel file uploads

    root /var/www/html/public;

    # Laravel's "index.php" handling
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM configuration
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;  # Forward requests to PHP-FPM container (app)
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;  # Fixed variable
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Deny access to .ht files (important for security)
    location ~ /\.ht {
        deny all;
    }
}
